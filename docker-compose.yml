version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: ExpenseSplitter-db
    restart: unless-stopped
    env_file:
      - .env
    ports: 
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17
    container_name: ExpenseSplitter-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
      POSTGRES_DB: expensesplitter_test
    ports:
      - "5433:5432"

  api: 
    
    build:
      context: .
      dockerfile: ExpenseSplitter.Api/Dockerfile

    container_name: ExpenseSplitter-api

    depends_on:
      - postgres
    
    env_file:
      - .env
    
    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  postgres-data: