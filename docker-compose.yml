version: '3.9'

services:
  postgres:
    image: postgres:17
    container_name: ExpenseSplitter-db
    restart: unless-stopped


    env_file:
      - .env
    ports: 
      - "5432:5432"
    
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api: 
    
    build:
      context: .
      dockerfile: ExpenseSplitter.Api/Dockerfile

    container_name: ExpenseSplitter-api

    depends_on:
      - postgres
    
    env_file:
      - .env
    
    ports:
      - "8080:8080"

    environment:
      ASPNETCORE_ENVIRONMENT: Development

volumes:
  postgres-data: